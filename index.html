<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Mátrix Űrsikló - Panoráma Galaktikus Küldetés</title>
  <style>
    body {
      background-color: #02040a;
      color: #00ffcc;
      font-family: 'Courier New', Courier, monospace;
      text-align: center;
      margin: 0;
      padding: 5px;
      overflow-x: hidden;
      overflow-y: hidden; /* Megakadályozza a görgetést, ha a végjáték animációja nagyobb lenne */
    }

    h1 {
      font-size: 1.1rem;
      margin: 4px 0;
      color: #00ffff;
      text-shadow: 0 0 10px rgba(0,255,255,0.7);
    }

    .cockpit-container {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: flex-start;
      gap: 15px;
      max-width: 1350px;
      margin: 0 auto;
    }

    .cockpit-frame {
      background: radial-gradient(circle, #0c1b2a 0%, #02040a 100%);
      border: 3px solid #00ffcc;
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.4), inset 0 0 35px rgba(0,136,255,0.3);
      padding: 10px;
    }

    .dashboard-panel {
      display: flex;
      justify-content: space-around;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #0088ff;
      border-radius: 6px;
      padding: 6px;
      margin-bottom: 8px;
      font-size: 0.8rem;
    }

    .stats span {
      color: #ff00ff;
      font-weight: bold;
    }

    .windshield {
      position: relative;
      width: 1080px;
      height: 540px;
      margin: 0 auto;
      background: #000;
      border: 3px solid rgba(0, 255, 204, 0.9);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: inset 0 0 35px rgba(0,255,204,0.6);
    }

    #flightCanvas {
      display: block;
      background: radial-gradient(circle at center, #15002b 0%, #02040a 100%);
    }

    /* Végjáték felirat container */
    #endGameOverlay {
      position: absolute;
      top: 0; left: 0;
      width: 1080px; height: 540px;
      background: radial-gradient(circle, rgba(0,255,255,0.2) 0%, rgba(2,4,10,0.9) 70%);
      display: none; /* Alapból rejtve */
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      pointer-events: none; /* Ne zavarjon be kattintásnál */
    }

    #endGameText {
      font-size: 4rem;
      font-weight: bold;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 0 20px #00ffff, 0 0 40px #ff00ff, 0 0 60px #00ffcc;
      animation: pulseGlow 1.5s infinite alternate;
      margin-bottom: 30px;
      line-height: 1.1;
      padding: 20px;
    }

    #endGameSub {
      font-size: 1.5rem;
      color: #00ffcc;
      animation: textPulse 1s infinite alternate;
    }

    @keyframes pulseGlow {
      from { text-shadow: 0 0 10px #00ffff, 0 0 20px #ff00ff, 0 0 30px #00ffcc; }
      to { text-shadow: 0 0 30px #00ffff, 0 0 60px #ff00ff, 0 0 90px #00ffcc; }
    }

    @keyframes textPulse {
      from { opacity: 0.6; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 65px);
      gap: 8px;
      justify-content: center;
      margin-top: 10px;
    }

    .control-btn {
      background: rgba(0, 255, 204, 0.25);
      border: 1px solid #00ffcc;
      color: #00ffcc;
      font-size: 1.2rem;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
    }

    .control-btn:active {
      background: rgba(0, 255, 204, 0.7);
      box-shadow: 0 0 15px #00ffcc;
    }

    .empty-btn { visibility: hidden; }

    .action-buttons { margin-top: 10px; }

    .btn {
      background: #0088ff;
      color: white;
      border: none;
      padding: 8px 16px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.85rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .external-vitrine {
      width: 220px;
      background: rgba(10, 20, 35, 0.95);
      border: 2px dashed #ff00ff;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 0 15px rgba(255,0,255,0.2);
      text-align: left;
    }

    .external-vitrine h3 {
      font-size: 0.85rem;
      margin: 0 0 8px 0;
      color: #ff00ff;
      text-align: center;
    }

    #plushieShelf {
      display: grid;
      /* Megnövelt rács a 20 plüsshöz (4 oszlop x 5 sor) */
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      min-height: 150px;
      align-content: start;
    }

    .plushie-item {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #00ffcc;
      border-radius: 6px;
      padding: 4px;
      text-align: center;
      font-size: 1.2rem;
      box-shadow: 0 0 6px rgba(0,255,204,0.3);
    }
  </style>
</head>
<body>

  <h1>MÁTRIX ŰRSIKLÓ — PANORÁMA KÜLDETÉS</h1>

  <div class="cockpit-container">
    
    <div class="cockpit-frame">
      <div class="dashboard-panel">
        <div>Pont: <span id="scoreVal">0</span></div>
        <div>Kristály: <span id="crystalsVal">0/7</span></div>
        <div>Galaxis: <span id="levelVal">1</span></div>
      </div>

      <div class="windshield">
        <canvas id="flightCanvas" width="1080" height="540"></canvas>
        <!-- Végjáték felirat overlay -->
        <div id="endGameOverlay">
          <div id="endGameText">KÜLDETÉS<br>TELJESÍTVE!</div>
          <div id="endGameSub">A GALAXIS MEGMENKÜLT!<br>Minden ereklyét begyűjtöttél.</div>
        </div>
      </div>

      <div class="controls">
        <div class="empty-btn"></div>
        <button class="control-btn" onclick="moveShip(0, -1)">▲</button>
        <div class="empty-btn"></div>
        <button class="control-btn" onclick="moveShip(-1, 0)">◀</button>
        <button class="control-btn" onclick="moveShip(0, 1)">▼</button>
        <button class="control-btn" onclick="moveShip(1, 0)">▶</button>
      </div>

      <div class="action-buttons">
        <button class="btn" onclick="resetGameData()">Játék Törlése</button>
      </div>
    </div>

    <!-- Külső plüss raktár / vitrin -->
    <div class="external-vitrine">
      <h3>GYŰJTŐI EREKLYÉK</h3>
      <div id="plushieShelf">
        <div style="grid-column: span 4; color: #888; font-size: 0.75rem; text-align: center; margin-top: 30px;">1000 pontonként érkezik új ereklye!</div>
      </div>
    </div>

  </div>

        audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

        osc.stop(now + 0.08);
