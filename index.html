<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Mátrix Űrsikló - Galaktikus HUD Labirintus</title>
  <style>
    body {
      background-color: #030712;
      color: #00ffcc;
      font-family: 'Courier New', Courier, monospace;
      text-align: center;
      margin: 0;
      padding: 5px;
      overflow: hidden;
    }

    h1 {
      font-size: 1.2rem;
      margin: 4px 0;
      color: #00ffff;
      text-shadow: 0 0 8px rgba(0,255,255,0.6);
    }

    .cockpit-frame {
      max-width: 650px;
      margin: 0 auto;
      background: radial-gradient(circle, rgba(15,28,45,0.9) format, rgba(2,6,15,0.95));
      border: 3px solid #00ffcc;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.4), inset 0 0 30px rgba(0,136,255,0.2);
      padding: 10px;
      position: relative;
    }

    .dashboard-panel {
      display: flex;
      justify-content: space-around;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #0088ff;
      border-radius: 6px;
      padding: 6px;
      margin-bottom: 8px;
      font-size: 0.85rem;
    }

    .stats span {
      color: #ff00ff;
      font-weight: bold;
    }

    .hud-screen {
      position: relative;
      width: 340px;
      height: 340px;
      margin: 0 auto;
      border: 2px solid rgba(0, 255, 204, 0.8);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0,255,204,0.3), inset 0 0 20px rgba(0,255,204,0.2);
    }

    /* Mozgó scifi galaxis háttér a szélvédő mögött */
    #spaceBackground {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1b0033 0%, #050b14 70%), url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=600&auto=format&fit=crop');
      background-size: cover;
      opacity: 0.4;
      z-index: 1;
      animation: spaceMove 20s linear infinite;
    }

    @keyframes spaceMove {
      0% { background-position: 0 0; }
      100% { background-position: 100px 200px; }
    }

    #labyrinthCanvas {
      position: relative;
      z-index: 2;
      background: transparent;
      display: block;
      margin: 10px auto;
      touch-action: none;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 50px);
      gap: 6px;
      justify-content: center;
      margin-top: 8px;
    }

    .control-btn {
      background: rgba(0, 255, 204, 0.15);
      border: 1px solid #00ffcc;
      color: #00ffcc;
      font-size: 1.1rem;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      transition: all 0.1s;
    }

    .control-btn:active {
      background: rgba(0, 255, 204, 0.5);
      box-shadow: 0 0 10px #00ffcc;
    }

    .empty-btn {
      visibility: hidden;
    }

    .action-buttons {
      margin-top: 10px;
    }

    .btn {
      background: #0088ff;
      color: white;
      border: none;
      padding: 6px 12px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      margin: 0 4px;
      box-shadow: 0 0 5px rgba(0,136,255,0.5);
    }

    .btn:hover {
      background: #00aaff;
    }

    .vitrine {
      margin-top: 10px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px dashed #ff00ff;
      border-radius: 6px;
      padding: 6px;
    }

    .vitrine h3 {
      font-size: 0.8rem;
      margin: 0 0 4px 0;
      color: #ff00ff;
    }

    #plushieShelf {
      display: flex;
      justify-content: center;
      gap: 8px;
      min-height: 30px;
      align-items: center;
      font-size: 1.3rem;
    }
  </style>
</head>
<body>

  <div class="cockpit-frame">
    <h1>MÁTRIX ŰRSIKLÓ — GALAKTIKUS HUD</h1>
    
    <div class="dashboard-panel">
      <div>Pont: <span id="scoreVal">0</span></div>
      <div>Lépések: <span id="stepsVal">0</span></div>
      <div>Galaxis (Szint): <span id="levelVal">1</span></div>
    </div>

    <div class="hud-screen">
      <div id="spaceBackground"></div>
      <canvas id="labyrinthCanvas" width="320" height="320"></canvas>
    </div>

    <div class="controls">
      <div class="empty-btn"></div>
      <button class="control-btn" onclick="movePlayer(0, -1)">▲</button>
      <div class="empty-btn"></div>
      <button class="control-btn" onclick="movePlayer(-1, 0)">◀</button>
      <button class="control-btn" onclick="movePlayer(0, 1)">▼</button>
      <button class="control-btn" onclick="movePlayer(1, 0)">▶</button>
    </div>

    <div class="vitrine">
      <h3>GYŰJTÖGETŐS VITRIN (Plüssök - 100 pontonként)</h3>
      <div id="plushieShelf">Még üres a polc</div>
    </div>

    <div class="action-buttons">
      <button class="btn" onclick="resetGameData()">Játék Törlése</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('labyrinthCanvas');
    const ctx = canvas.getContext('2d');

    let score = parseInt(localStorage.getItem('matrix_score')) || 0;
    let steps = parseInt(localStorage.getItem('matrix_steps')) || 0;
    let level = parseInt(localStorage.getItem('matrix_level')) || 1;
    let plushies = JSON.parse(localStorage.getItem('matrix_plushies')) || [];

    const plushieIcons = ['🧸', '🤖', '🐱', '🦄', '🚀', '⭐', '💎', '👑', '🛸', '🪐'];

    // Dinamikus rácsméret a szint alapján (nehezedik és tágul a galaxis)
    let gridSize = 9; 
    let map = [];
    let player = { x: 1, y: 1 };
    let exitPos = { x: 7, y: 7 };

    function generateLabyrinth() {
      // Pályaméret növelése szintenként (pl. 9, 11, 13...)
      gridSize = 9 + (Math.floor((level - 1) / 2) * 2);
      if (gridSize > 15) gridSize = 15; // Max méret mobilon

      map = [];
      for (let r = 0; r < gridSize; r++) {
        let row = [];
        for (let c = 0; c < gridSize; c++) {
          // Keret fal, belsejében véletlenszerű akadályok
          if (r === 0 || c === 0 || r === gridSize - 1 || c === gridSize - 1) {
            row.push(1);
          } else {
            // 25% esély falra, de biztosítjuk az utat
            row.push(Math.random() < 0.28 ? 1 : 0);
          }
        }
        map.push(row);
      }

      // Kezdőpont és cél kijelölése
      player = { x: 1, y: 1 };
      map[player.y][player.x] = 0;

      exitPos = { x: gridSize - 2, y: gridSize - 2 };
      map[exitPos.y][exitPos.x] = 2; // Cél / Galaktikus Kapu
      map[1][2] = 0; // Biztosítjuk, hogy ki tud indulni
    }

    function updateHUD() {
      document.getElementById('scoreVal').innerText = score;
      document.getElementById('stepsVal').innerText = steps;
      document.getElementById('levelVal').innerText = level;

      let shelf = document.getElementById('plushieShelf');
      if (plushies.length === 0) {
        shelf.innerHTML = "Még üres a polc (100 pontonként jön plüss!)";
      } else {
        shelf.innerHTML = plushies.join(' ');
      }

      localStorage.setItem('matrix_score', score);
      localStorage.setItem('matrix_steps', steps);
      localStorage.setItem('matrix_level', level);
      localStorage.setItem('matrix_plushies', JSON.stringify(plushies));
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let tileSize = canvas.width / gridSize;

      for (let r = 0; r < map.length; r++) {
        for (let c = 0; c < map[r].length; c++) {
          if (map[r][c] === 1) {
            ctx.fillStyle = 'rgba(0, 136, 255, 0.4)'; // Hologramos fal
            ctx.fillRect(c * tileSize, r * tileSize, tileSize - 1, tileSize - 1);
            ctx.strokeStyle = '#00ffcc';
            ctx.strokeRect(c * tileSize, r * tileSize, tileSize - 1, tileSize - 1);
          } else if (map[r][c] === 2) {
            ctx.fillStyle = '#ff00ff'; // Galaktikus Kapu (cél)
            ctx.fillRect(c * tileSize, r * tileSize, tileSize - 1, tileSize - 1);
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ff00ff';
          } else {
            ctx.fillStyle = 'rgba(5, 11, 20, 0.3)'; // Átlátszó út
            ctx.fillRect(c * tileSize, r * tileSize, tileSize - 1, tileSize - 1);
          }
        }
      }

      // Játékos Űrsikló / Fénygömb a szélvédőn
      ctx.fillStyle = '#00ffff';
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#00ffff';
      ctx.beginPath();
      ctx.arc((player.x + 0.5) * tileSize, (player.y + 0.5) * tileSize, tileSize / 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0; // Reset
    }

    function movePlayer(dx, dy) {
      let newX = player.x + dx;
      let newY = player.y + dy;

      if (map[newY] && map[newY][newX] !== undefined && map[newY][newX] !== 1) {
        player.x = newX;
        player.y = newY;
        steps++;

        if (map[newY][newX] === 2) {
          score += 30;
          level++;
          checkPlushieReward();
          alert("Sikeres ugrás! Átléptél a következő galaxisba!");
          generateLabyrinth();
        }
        updateHUD();
        draw();
      }
    }

    function checkPlushieReward() {
      let expectedPlushies = Math.floor(score / 100);
      while (plushies.length < expectedPlushies && plushies.length < plushieIcons.length) {
        let nextIcon = plushieIcons[plushies.length];
        plushies.push(nextIcon);
      }
    }

    function resetGameData() {
      if (confirm("Biztosan nullázni akarod az állást és a vitrint?")) {
        localStorage.clear();
        score = 0;
        steps = 0;
        level = 1;
        plushies = [];
        generateLabyrinth();
        updateHUD();
        draw();
      }
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp') movePlayer(0, -1);
      if (e.key === 'ArrowDown') movePlayer(0, 1);
      if (e.key === 'ArrowLeft') movePlayer(-1, 0);
      if (e.key === 'ArrowRight') movePlayer(1, 0);
    });

    // Induláskor generálunk egy pályát
    generateLabyrinth();
    updateHUD();
    draw();
  </script>
</body>
</html>
