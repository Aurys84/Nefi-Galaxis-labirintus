<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Mátrix Űrsikló - 3D Galaktikus Küldetés</title>
  <style>
    body {
      background-color: #02040a;
      color: #00ffcc;
      font-family: 'Courier New', Courier, monospace;
      text-align: center;
      margin: 0;
      padding: 5px;
      overflow-x: hidden;
    }

    h1 {
      font-size: 1.1rem;
      margin: 4px 0;
      color: #00ffff;
      text-shadow: 0 0 10px rgba(0,255,255,0.7);
    }

    .cockpit-container {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: flex-start;
      gap: 15px;
      max-width: 800px;
      margin: 0 auto;
    }

    .cockpit-frame {
      background: radial-gradient(circle, #0c1b2a 0%, #02040a 100%);
      border: 3px solid #00ffcc;
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.4), inset 0 0 35px rgba(0,136,255,0.3);
      padding: 10px;
    }

    .dashboard-panel {
      display: flex;
      justify-content: space-around;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #0088ff;
      border-radius: 6px;
      padding: 6px;
      margin-bottom: 8px;
      font-size: 0.8rem;
    }

    .stats span {
      color: #ff00ff;
      font-weight: bold;
    }

    .windshield {
      position: relative;
      width: 440px;
      height: 440px;
      margin: 0 auto;
      background: #000;
      border: 3px solid rgba(0, 255, 204, 0.9);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: inset 0 0 30px rgba(0,255,204,0.6);
    }

    #flightCanvas {
      display: block;
      background: radial-gradient(circle at center, #15002b 0%, #02040a 100%);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 55px);
      gap: 6px;
      justify-content: center;
      margin-top: 8px;
    }

    .control-btn {
      background: rgba(0, 255, 204, 0.2);
      border: 1px solid #00ffcc;
      color: #00ffcc;
      font-size: 1.1rem;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
    }

    .control-btn:active {
      background: rgba(0, 255, 204, 0.6);
      box-shadow: 0 0 12px #00ffcc;
    }

    .empty-btn { visibility: hidden; }

    .action-buttons { margin-top: 8px; }

    .btn {
      background: #0088ff;
      color: white;
      border: none;
      padding: 6px 12px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.8rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .external-vitrine {
      width: 220px;
      background: rgba(10, 20, 35, 0.95);
      border: 2px dashed #ff00ff;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 0 15px rgba(255,0,255,0.2);
      text-align: left;
    }

    .external-vitrine h3 {
      font-size: 0.85rem;
      margin: 0 0 8px 0;
      color: #ff00ff;
      text-align: center;
    }

    #plushieShelf {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      min-height: 120px;
      align-content: start;
    }

    .plushie-item {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #00ffcc;
      border-radius: 8px;
      padding: 6px;
      text-align: center;
      font-size: 1.5rem;
      box-shadow: 0 0 6px rgba(0,255,204,0.3);
    }
  </style>
</head>
<body>

  <h1>MÁTRIX ŰRSIKLÓ — KRISTÁLY KÜLDETÉS</h1>

  <div class="cockpit-container">
    
    <div class="cockpit-frame">
      <div class="dashboard-panel">
        <div>Pont: <span id="scoreVal">0</span></div>
        <div>Kristály: <span id="crystalsVal">0/3</span></div>
        <div>Galaxis: <span id="levelVal">1</span></div>
      </div>

      <div class="windshield">
        <canvas id="flightCanvas" width="440" height="440"></canvas>
      </div>

      <div class="controls">
        <div class="empty-btn"></div>
        <button class="control-btn" onclick="moveShip(0, -1)">▲</button>
        <div class="empty-btn"></div>
        <button class="control-btn" onclick="moveShip(-1, 0)">◀</button>
        <button class="control-btn" onclick="moveShip(0, 1)">▼</button>
        <button class="control-btn" onclick="moveShip(1, 0)">▶</button>
      </div>

      <div class="action-buttons">
        <button class="btn" onclick="resetGameData()">Játék Törlése</button>
      </div>
    </div>

    <!-- Külső plüss raktár / vitrin -->
    <div class="external-vitrine">
      <h3>GYŰJTŐI PLÜSSÖK</h3>
      <div id="plushieShelf">
        <div style="grid-column: span 2; color: #888; font-size: 0.75rem; text-align: center; margin-top: 20px;">100 pontonként érkezik új ereklye!</div>
      </div>
    </div>

  </div>

  <script>
    const canvas = document.getElementById('flightCanvas');
    const ctx = canvas.getContext('2d');

    let score = parseInt(localStorage.getItem('matrix_score')) || 0;
    let steps = parseInt(localStorage.getItem('matrix_steps')) || 0;
    let level = parseInt(localStorage.getItem('matrix_level')) || 1;
    let plushies = JSON.parse(localStorage.getItem('matrix_plushies')) || [];

    const plushieData = [
      { icon: '🧸', name: 'Mátrix Maci' },
      { icon: '🤖', name: 'Cyber Droid' },
      { icon: '🐱', name: 'Asztro Cica' },
      { icon: '🦄', name: 'Galaxis Unikornis' },
      { icon: '🚀', name: 'Mini Űrsikló' },
      { icon: '⭐', name: 'Szuper Nova' },
      { icon: '💎', name: 'Kvarc Kristály' },
      { icon: '👑', name: 'Labor Korona' }
    ];

    let gridWidth = 11;
    let gridHeight = 11;

    let ship = { x: 5, y: 9, dir: 'UP' };
    let obstacles = [];
    let crystals = [];
    let goal = { x: 5, y: 1 };
    let animPulse = 0;

    function initSector() {
      obstacles = [];
      crystals = [];
      goal = { x: Math.floor(Math.random() * (gridWidth - 2)) + 1, y: 1 };

      // Garanciás útvonal térkép, hogy minden elérhető legyen
      let safePath = {};
      
      // 1. Kristályok elhelyezése és biztonságos út építése hozzájuk
      let tempX = ship.x;
      let tempY = ship.y;

      let cPositions = [
        { x: 2, y: 6 },
        { x: 8, y: 6 },
        { x: 5, y: 4 }
      ];

      // Kicsit randomizáljuk a kristályok helyét, de ésszerűen
      cPositions.forEach((pos, idx) => {
        let cx = Math.max(1, Math.min(gridWidth - 2, pos.x + (Math.floor(Math.random() * 3) - 1)));
        let cy = Math.max(2, Math.min(gridHeight - 3, pos.y + (Math.floor(Math.random() * 3) - 1)));
        crystals.push({ x: cx, y: cy, collected: false });
      });

      // Út rajzolása a hajótól a kristályokon át a kapuhoz
      let currentLoc = { x: ship.x, y: ship.y };
      crystals.forEach(c => {
        while (currentLoc.x !== c.x || currentLoc.y !== c.y) {
          if (currentLoc.x < c.x) currentLoc.x++;
          else if (currentLoc.x > c.x) currentLoc.x--;
          else if (currentLoc.y < c.y) currentLoc.y++;
          else if (currentLoc.y > c.y) currentLoc.y--;
          safePath[`${currentLoc.x},${currentLoc.y}`] = true;
        }
      });

      // Utolsó kristálytól a kapuhoz
      while (currentLoc.x !== goal.x || currentLoc.y !== goal.y) {
        if (currentLoc.x < goal.x) currentLoc.x++;
        else if (currentLoc.x > goal.x) currentLoc.x--;
        else if (currentLoc.y < goal.y) currentLoc.y++;
        else if (currentLoc.y > goal.y) currentLoc.y--;
        safePath[`${currentLoc.x},${currentLoc.y}`] = true;
      }

      // Kezdő és cél cellák biztosítása
      safePath[`${ship.x},${ship.y}`] = true;
      safePath[`${goal.x},${goal.y}`] = true;
      crystals.forEach(c => safePath[`${c.x},${c.y}`] = true);

      // Véletlen akadályok, de a safePath-et soha nem zárjuk el!
      let count = 12 + level;
      for (let i = 0; i < count; i++) {
        let ox = Math.floor(Math.random() * gridWidth);
        let oy = Math.floor(Math.random() * (gridHeight - 2)) + 1;
        let key = `${ox},${oy}`;
        if (!safePath[key]) {
          obstacles.push({ x: ox, y: oy });
        }
      }
    }

    function updateHUD() {
      let collectedCount = crystals.filter(c => c.collected).length;
      document.getElementById('scoreVal').innerText = score;
      document.getElementById('crystalsVal').innerText = `${collectedCount}/${crystals.length}`;
      document.getElementById('levelVal').innerText = level;

      let shelf = document.getElementById('plushieShelf');
      if (plushies.length === 0) {
        shelf.innerHTML = '<div style="grid-column: span 2; color: #888; font-size: 0.75rem; text-align: center; margin-top: 20px;">100 pontonként érkezik új ereklye!</div>';
      } else {
        shelf.innerHTML = '';
        plushies.forEach(pIdx => {
          let p = plushieData[pIdx];
          let div = document.createElement('div');
          div.className = 'plushie-item';
          div.innerHTML = `${p.icon}<br><span style="font-size:0.55rem; color:#00ffcc;">${p.name}</span>`;
          shelf.appendChild(div);
        });
      }

      localStorage.setItem('matrix_score', score);
      localStorage.setItem('matrix_steps', steps);
      localStorage.setItem('matrix_level', level);
      localStorage.setItem('matrix_plushies', JSON.stringify(plushies));
    }

    function drawSpaceship3D(cx, cy, size, dir) {
      ctx.save();
      ctx.translate(cx, cy);

      if (dir === 'DOWN') ctx.rotate(Math.PI);
      else if (dir === 'LEFT') ctx.rotate(-Math.PI / 2);
      else if (dir === 'RIGHT') ctx.rotate(Math.PI / 2);

      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.beginPath();
      ctx.ellipse(0, size * 0.4, size * 0.8, size * 0.4, 0, 0, Math.PI * 2);
      ctx.fill();

      let grad = ctx.createLinearGradient(-size, -size, size, size);
      grad.addColorStop(0, '#00ffff');
      grad.addColorStop(0.5, '#0088ff');
      grad.addColorStop(1, '#002244');
      ctx.fillStyle = grad;

      ctx.beginPath();
      ctx.moveTo(0, -size * 1.2);
      ctx.lineTo(-size * 0.8, size * 0.9);
      ctx.lineTo(-size * 0.3, size * 0.6);
      ctx.lineTo(0, size * 0.9);
      ctx.lineTo(size * 0.3, size * 0.6);
      ctx.lineTo(size * 0.8, size * 0.9);
      ctx.closePath();
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#00ffff';
      ctx.fill();

      ctx.fillStyle = '#ffaa00';
      ctx.beginPath();
      ctx.arc(0, -size * 0.2, size * 0.28, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ff0066';
      ctx.shadowColor = '#ff0066';
      ctx.beginPath();
      ctx.moveTo(-size * 0.3, size * 0.9);
      ctx.lineTo(0, size * 1.5);
      ctx.lineTo(size * 0.3, size * 0.9);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function drawFlight() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let tileSize = canvas.width / gridWidth;
      animPulse += 0.08;

      ctx.strokeStyle = 'rgba(0, 255, 204, 0.08)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= gridWidth; i++) {
        ctx.beginPath();
        ctx.moveTo(i * tileSize, 0);
        ctx.lineTo(i * tileSize, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * tileSize);
        ctx.lineTo(canvas.width, i * tileSize);
        ctx.stroke();
      }

      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 35; i++) {
        let sx = (i * 31 + steps * 3) % canvas.width;
        let sy = (i * 47 + steps * 6) % canvas.height;
        ctx.fillRect(sx, sy, 1.5, 1.5);
      }

      let gateX = (goal.x + 0.5) * tileSize;
      let gateY = (goal.y + 0.5) * tileSize;
      let allCollected = crystals.every(c => c.collected);

      ctx.shadowBlur = allCollected ? 30 : 15;
      ctx.shadowColor = allCollected ? '#00ffcc' : '#ff0055';
      ctx.fillStyle = allCollected ? '#00ffcc' : '#ff0033';
      ctx.beginPath();
      let pulseSize = tileSize / 2.2 + (allCollected ? Math.sin(animPulse) * 4 : 0);
      ctx.arc(gateX, gateY, Math.max(5, pulseSize), 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(gateX, gateY, tileSize / 6, 0, Math.PI * 2);
      ctx.fill();

      crystals.forEach(c => {
        if (!c.collected) {
          let cx = (c.x + 0.5) * tileSize;
          let cy = (c.y + 0.5) * tileSize + Math.sin(animPulse * 2 + c.x) * 3;

          ctx.fillStyle = '#ff00ff';
          ctx.shadowBlur = 15;
          ctx.shadowColor = '#ff00ff';
          ctx.beginPath();
          ctx.arc(cx, cy, tileSize / 3.2, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(cx, cy, tileSize / 7, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      obstacles.forEach(obs => {
        let ox = (obs.x + 0.5) * tileSize;
        let oy = (obs.y + 0.5) * tileSize;

        let oGrad = ctx.createRadialGradient(ox - 3, oy - 3, 2, ox, oy, tileSize / 2.5);
        oGrad.addColorStop(0, '#00ffff');
        oGrad.addColorStop(0.5, '#0055ff');
        oGrad.addColorStop(1, '#001133');

        ctx.fillStyle = oGrad;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#0088ff';
        ctx.beginPath();
        ctx.arc(ox, oy, tileSize / 2.6, 0, Math.PI * 2);
        ctx.fill();
      });

      let cx = (ship.x + 0.5) * tileSize;
      let cy = (ship.y + 0.5) * tileSize;
      drawSpaceship3D(cx, cy, tileSize / 2.2, ship.dir);
      ctx.shadowBlur = 0;
    }

    function moveShip(dx, dy) {
      if (dx === 0 && dy === -1) ship.dir = 'UP';
      else if (dx === 0 && dy === 1) ship.dir = 'DOWN';
      else if (dx === -1 && dy === 0) ship.dir = 'LEFT';
      else if (dx === 1 && dy === 0) ship.dir = 'RIGHT';

      let nx = ship.x + dx;
      let ny = ship.y + dy;

      if (nx >= 0 && nx < gridWidth && ny >= 0 && ny < gridHeight) {
        let hit = obstacles.some(o => o.x === nx && o.y === ny);
        if (hit) {
          score = Math.max(0, score - 5);
          alert("Ütközés az aszteroidával! Vissza a bázisra.");
          ship.x = 5; ship.y = 9; ship.dir = 'UP';
          initSector();
        } else {
          ship.x = nx;
          ship.y = ny;
          steps++;

          crystals.forEach(c => {
            if (!c.collected && c.x === ship.x && c.y === ship.y) {
              c.collected = true;
              score += 15;
            }
          });

          if (ship.x === goal.x && ship.y === goal.y) {
            let allCollected = crystals.every(c => c.collected);
            if (allCollected) {
              score += 60;
              level++;
              checkPlushieReward();
              alert("Fantasztikus navigáció! Kapu kinyitva, új galaxis elérve!");
              ship.x = 5; ship.y = 9; ship.dir = 'UP';
              initSector();
            } else {
              alert("A galaktikus kapu zárva van! Előbb gyűjtsd össze az összes energiakristályt!");
            }
          }
        }
        updateHUD();
        drawFlight();
      }
    }

    function checkPlushieReward() {
      let expectedCount = Math.floor(score / 100);
      while (plushies.length < expectedCount && plushies.length < plushieData.length) {
        plushies.push(plushies.length);
      }
    }

    function resetGameData() {
      if (confirm("Biztosan nullázod a repülési naplót?")) {
        localStorage.clear();
        score = 0; steps = 0; level = 1; plushies = [];
        ship = { x: 5, y: 9, dir: 'UP' };
        initSector();
        updateHUD();
        drawFlight();
      }
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp') moveShip(0, -1);
      if (e.key === 'ArrowDown') moveShip(0, 1);
      if (e.key === 'ArrowLeft') moveShip(-1, 0);
      if (e.key === 'ArrowRight') moveShip(1, 0);
    });

    initSector();
    updateHUD();
    
    setInterval(() => {
      drawFlight();
    }, 50);
  </script>
</body>
</html>
