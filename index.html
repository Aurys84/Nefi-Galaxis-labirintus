<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Mátrix Űrsikló - Galaktikus Navigáció</title>
  <style>
    body {
      background-color: #020610;
      color: #00ffcc;
      font-family: 'Courier New', Courier, monospace;
      text-align: center;
      margin: 0;
      padding: 5px;
      overflow: hidden;
    }

    h1 {
      font-size: 1.1rem;
      margin: 4px 0;
      color: #00ffff;
      text-shadow: 0 0 8px rgba(0,255,255,0.6);
    }

    .cockpit-frame {
      max-width: 680px;
      margin: 0 auto;
      background: radial-gradient(circle, #0f1c2d 0%, #020610 100%);
      border: 3px solid #00ffcc;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.4), inset 0 0 30px rgba(0,136,255,0.3);
      padding: 10px;
      position: relative;
    }

    .dashboard-panel {
      display: flex;
      justify-content: space-around;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #0088ff;
      border-radius: 6px;
      padding: 6px;
      margin-bottom: 8px;
      font-size: 0.85rem;
    }

    .stats span {
      color: #ff00ff;
      font-weight: bold;
    }

    .windshield {
      position: relative;
      width: 480px;
      height: 480px;
      margin: 0 auto;
      background: #000;
      border: 3px solid rgba(0, 255, 204, 0.9);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: inset 0 0 25px rgba(0,255,204,0.5);
    }

    #flightCanvas {
      display: block;
      background: radial-gradient(circle at center, #110022 0%, #020610 100%);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      gap: 6px;
      justify-content: center;
      margin-top: 8px;
    }

    .control-btn {
      background: rgba(0, 255, 204, 0.2);
      border: 1px solid #00ffcc;
      color: #00ffcc;
      font-size: 1.1rem;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
    }

    .control-btn:active {
      background: rgba(0, 255, 204, 0.6);
      box-shadow: 0 0 10px #00ffcc;
    }

    .empty-btn { visibility: hidden; }

    .action-buttons { margin-top: 8px; }

    .btn {
      background: #0088ff;
      color: white;
      border: none;
      padding: 6px 12px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.8rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .vitrine {
      margin-top: 8px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px dashed #ff00ff;
      border-radius: 6px;
      padding: 5px;
    }

    .vitrine h3 {
      font-size: 0.8rem;
      margin: 0 0 3px 0;
      color: #ff00ff;
    }

    #plushieShelf {
      display: flex;
      justify-content: center;
      gap: 8px;
      min-height: 25px;
      align-items: center;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <div class="cockpit-frame">
    <h1>MÁTRIX ŰRSIKLÓ — GALAKTIKUS NAVIGÁCIÓ</h1>
    
    <div class="dashboard-panel">
      <div>Pont: <span id="scoreVal">0</span></div>
      <div>Lépések: <span id="stepsVal">0</span></div>
      <div>Galaxis: <span id="levelVal">1</span></div>
    </div>

    <div class="windshield">
      <!-- 2x nagyobb felbontású szélvédő vászon (480x480) -->
      <canvas id="flightCanvas" width="480" height="480"></canvas>
    </div>

    <div class="controls">
      <div class="empty-btn"></div>
      <button class="control-btn" onclick="moveShip(0, -1)">▲ Gáz</button>
      <div class="empty-btn"></div>
      <button class="control-btn" onclick="moveShip(-1, 0)">◄ Balra</button>
      <button class="control-btn" onclick="moveShip(0, 1)">▼ Vissza</button>
      <button class="control-btn" onclick="moveShip(1, 0)">► Jobbra</button>
    </div>

    <div class="vitrine">
      <h3>PLÜSS VITRIN (100 pontonként kapod)</h3>
      <div id="plushieShelf">Még üres a polc</div>
    </div>

    <div class="action-buttons">
      <button class="btn" onclick="resetGameData()">Játék Törlése</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('flightCanvas');
    const ctx = canvas.getContext('2d');

    let score = parseInt(localStorage.getItem('matrix_score')) || 0;
    let steps = parseInt(localStorage.getItem('matrix_steps')) || 0;
    let level = parseInt(localStorage.getItem('matrix_level')) || 1;
    let plushies = JSON.parse(localStorage.getItem('matrix_plushies')) || [];

    const plushieIcons = ['🧸', '🤖', '🐱', '🦄', '🚀', '⭐', '💎', '👑', '🛸', '🪐'];

    // 12x12-es nagyobb rács a tágasabb szélvédőhöz
    let gridWidth = 12;
    let gridHeight = 12;

    let ship = { x: 6, y: 10, dir: 'UP' }; // Kezdő pozíció és nézési irány ('UP', 'DOWN', 'LEFT', 'RIGHT')
    let obstacles = [];
    let goal = { x: 6, y: 0 };

    function initSector() {
      obstacles = [];
      // Több akadály a nehezebb, izgalmasabb kihívásért
      let obstacleCount = 15 + level * 3;
      for (let i = 0; i < obstacleCount; i++) {
        let ox = Math.floor(Math.random() * gridWidth);
        let oy = Math.floor(Math.random() * (gridHeight - 2)) + 1;
        if (!(ox === 6 && oy === 10)) {
          obstacles.push({ x: ox, y: oy });
        }
      }
      goal = { x: Math.floor(Math.random() * gridWidth), y: 0 };
    }

    function updateHUD() {
      document.getElementById('scoreVal').innerText = score;
      document.getElementById('stepsVal').innerText = steps;
      document.getElementById('levelVal').innerText = level;

      let shelf = document.getElementById('plushieShelf');
      if (plushies.length === 0) {
        shelf.innerHTML = "Még üres a polc";
      } else {
        shelf.innerHTML = plushies.join(' ');
      }

      localStorage.setItem('matrix_score', score);
      localStorage.setItem('matrix_steps', steps);
      localStorage.setItem('matrix_level', level);
      localStorage.setItem('matrix_plushies', JSON.stringify(plushies));
    }

    function drawFlight() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let tileSize = canvas.width / gridWidth;

      // Háttér csillagok
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 30; i++) {
        let sx = (i * 41 + steps * 4) % canvas.width;
        let sy = (i * 59 + steps * 8) % canvas.height;
        ctx.fillRect(sx, sy, 1.8, 1.8);
      }

      // Galaktikus Kapu (Cél)
      ctx.fillStyle = '#ff00ff';
      ctx.shadowBlur = 18;
      ctx.shadowColor = '#ff00ff';
      ctx.fillRect(goal.x * tileSize + 4, goal.y * tileSize + 4, tileSize - 8, tileSize - 8);

      // Aszteroidák / Akadályok
      ctx.fillStyle = '#0088ff';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#0088ff';
      obstacles.forEach(obs => {
        ctx.beginPath();
        ctx.arc((obs.x + 0.5) * tileSize, (obs.y + 0.5) * tileSize, tileSize / 2.8, 0, Math.PI * 2);
        ctx.fill();
      });

      // Űrsikló kirajzolása a pontos irányba fordulva
      ctx.fillStyle = '#00ffff';
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#00ffff';
      
      let cx = (ship.x + 0.5) * tileSize;
      let cy = (ship.y + 0.5) * tileSize;
      let size = tileSize / 2.2;

      ctx.save();
      ctx.translate(cx, cy);

      // Elforgatás az irány alapján
      if (ship.dir === 'DOWN') ctx.rotate(Math.PI);
      else if (ship.dir === 'LEFT') ctx.rotate(-Math.PI / 2);
      else if (ship.dir === 'RIGHT') ctx.rotate(Math.PI / 2);
      // 'UP' esetén nincs forgatás (0 fok)

      ctx.beginPath();
      ctx.moveTo(0, -size);       // Orr
      ctx.lineTo(-size, size);    // Bal sarok
      ctx.lineTo(0, size * 0.6);  // Farok bemélyedés
      ctx.lineTo(size, size);     // Jobb sarok
      ctx.closePath();
      ctx.fill();

      ctx.restore();
      ctx.shadowBlur = 0;
    }

    function moveShip(dx, dy) {
      // Irány beállítása a mozgásnak megfelelően
      if (dx === 0 && dy === -1) ship.dir = 'UP';
      else if (dx === 0 && dy === 1) ship.dir = 'DOWN';
      else if (dx === -1 && dy === 0) ship.dir = 'LEFT';
      else if (dx === 1 && dy === 0) ship.dir = 'RIGHT';

      let nx = ship.x + dx;
      let ny = ship.y + dy;

      if (nx >= 0 && nx < gridWidth && ny >= 0 && ny < gridHeight) {
        let hit = obstacles.some(o => o.x === nx && o.y === ny);
        if (hit) {
          score = Math.max(0, score - 5);
          alert("Ütközés az aszteroidával! Vissza a bázisra!");
          ship.x = 6; ship.y = 10; ship.dir = 'UP';
        } else {
          ship.x = nx;
          ship.y = ny;
          steps++;

          if (ship.x === goal.x && ship.y === goal.y) {
            score += 40;
            level++;
            checkPlushieReward();
            alert("Gratulálok! Sikeresen átléptél a következő galaktikus szektorba!");
            ship.x = 6; ship.y = 10; ship.dir = 'UP';
            initSector();
          }
        }
        updateHUD();
        drawFlight();
      }
    }

    function checkPlushieReward() {
      let expectedPlushies = Math.floor(score / 100);
      while (plushies.length < expectedPlushies && plushies.length < plushieIcons.length) {
        plushies.push(plushieIcons[plushies.length]);
      }
    }

    function resetGameData() {
      if (confirm("Biztosan nullázod a repülési naplót?")) {
        localStorage.clear();
        score = 0; steps = 0; level = 1; plushies = [];
        ship = { x: 6, y: 10, dir: 'UP' };
        initSector();
        updateHUD();
        drawFlight();
      }
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp') moveShip(0, -1);
      if (e.key === 'ArrowDown') moveShip(0, 1);
      if (e.key === 'ArrowLeft') moveShip(-1, 0);
      if (e.key === 'ArrowRight') moveShip(1, 0);
    });

    initSector();
    updateHUD();
    drawFlight();
  </script>
</body>
</html>
