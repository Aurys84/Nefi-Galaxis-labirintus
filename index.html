
<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Mátrix Űrsikló - Galaktikus Repülés</title>
  <style>
    body {
      background-color: #020610;
      color: #00ffcc;
      font-family: 'Courier New', Courier, monospace;
      text-align: center;
      margin: 0;
      padding: 5px;
      overflow: hidden;
    }

    h1 {
      font-size: 1.1rem;
      margin: 4px 0;
      color: #00ffff;
      text-shadow: 0 0 8px rgba(0,255,255,0.6);
    }

    .cockpit-frame {
      max-width: 600px;
      margin: 0 auto;
      background: radial-gradient(circle, #0f1c2d 0%, #020610 100%);
      border: 3px solid #00ffcc;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.4), inset 0 0 30px rgba(0,136,255,0.3);
      padding: 10px;
      position: relative;
    }

    .dashboard-panel {
      display: flex;
      justify-content: space-around;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #0088ff;
      border-radius: 6px;
      padding: 6px;
      margin-bottom: 8px;
      font-size: 0.85rem;
    }

    .stats span {
      color: #ff00ff;
      font-weight: bold;
    }

    .windshield {
      position: relative;
      width: 320px;
      height: 320px;
      margin: 0 auto;
      background: #000;
      border: 3px solid rgba(0, 255, 204, 0.9);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: inset 0 0 25px rgba(0,255,204,0.5);
    }

    #flightCanvas {
      display: block;
      background: radial-gradient(circle at center, #110022 0%, #020610 100%);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 55px);
      gap: 6px;
      justify-content: center;
      margin-top: 8px;
    }

    .control-btn {
      background: rgba(0, 255, 204, 0.2);
      border: 1px solid #00ffcc;
      color: #00ffcc;
      font-size: 1.1rem;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
    }

    .control-btn:active {
      background: rgba(0, 255, 204, 0.6);
      box-shadow: 0 0 10px #00ffcc;
    }

    .empty-btn { visibility: hidden; }

    .action-buttons { margin-top: 8px; }

    .btn {
      background: #0088ff;
      color: white;
      border: none;
      padding: 6px 12px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.8rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .vitrine {
      margin-top: 8px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px dashed #ff00ff;
      border-radius: 6px;
      padding: 5px;
    }

    .vitrine h3 {
      font-size: 0.8rem;
      margin: 0 0 3px 0;
      color: #ff00ff;
    }

    #plushieShelf {
      display: flex;
      justify-content: center;
      gap: 8px;
      min-height: 25px;
      align-items: center;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <div class="cockpit-frame">
    <h1>MÁTRIX ŰRSIKLÓ — GALAKTIKUS REPTETŐ</h1>
    
    <div class="dashboard-panel">
      <div>Pont: <span id="scoreVal">0</span></div>
      <div>Táv (Lépés): <span id="stepsVal">0</span></div>
      <div>Galaxis: <span id="levelVal">1</span></div>
    </div>

    <div class="windshield">
      <canvas id="flightCanvas" width="320" height="320"></canvas>
    </div>

    <div class="controls">
      <div class="empty-btn"></div>
      <button class="control-btn" onclick="moveShip(0, -1)">▲ Gáz</button>
      <div class="empty-btn"></div>
      <button class="control-btn" onclick="moveShip(-1, 0)">◄ Balra</button>
      <button class="control-btn" onclick="moveShip(0, 1)">▼ Vissza</button>
      <button class="control-btn" onclick="moveShip(1, 0)">► Jobbra</button>
    </div>

    <div class="vitrine">
      <h3>PLÜSS VITRIN (100 pontonként kapod)</h3>
      <div id="plushieShelf">Még üres a polc</div>
    </div>

    <div class="action-buttons">
      <button class="btn" onclick="resetGameData()">Játék Törlése</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('flightCanvas');
    const ctx = canvas.getContext('2d');

    let score = parseInt(localStorage.getItem('matrix_score')) || 0;
    let steps = parseInt(localStorage.getItem('matrix_steps')) || 0;
    let level = parseInt(localStorage.getItem('matrix_level')) || 1;
    let plushies = JSON.parse(localStorage.getItem('matrix_plushies')) || [];

    const plushieIcons = ['🧸', '🤖', '🐱', '🦄', '🚀', '⭐', '💎', '👑', '🛸', '🪐'];

    // Űrsikló pozíció a szélvédőn (X, Y)
    let ship = { x: 4, y: 7 };
    let gridWidth = 9;
    let gridHeight = 9;

    // Galaktikus útvonal akadályok és csillagkapuk generálása
    let obstacles = [];
    let goal = { x: 4, y: 0 };

    function initSector() {
      obstacles = [];
      // Generálunk véletlenszerű aszteroidákat / útvonal akadályokat a szélvédőre
      for (let i = 0; i < 12 + level * 2; i++) {
        let ox = Math.floor(Math.random() * gridWidth);
        let oy = Math.floor(Math.random() * (gridHeight - 2)) + 1;
        if (!(ox === 4 && oy === 7)) { // Ne a hajóra essen
          obstacles.push({ x: ox, y: oy });
        }
      }
      goal = { x: Math.floor(Math.random() * gridWidth), y: 0 };
    }

    function updateHUD() {
      document.getElementById('scoreVal').innerText = score;
      document.getElementById('stepsVal').innerText = steps;
      document.getElementById('levelVal').innerText = level;

      let shelf = document.getElementById('plushieShelf');
      if (plushies.length === 0) {
        shelf.innerHTML = "Még üres a polc";
      } else {
        shelf.innerHTML = plushies.join(' ');
      }

      localStorage.setItem('matrix_score', score);
      localStorage.setItem('matrix_steps', steps);
      localStorage.setItem('matrix_level', level);
      localStorage.setItem('matrix_plushies', JSON.stringify(plushies));
    }

    function drawFlight() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let tileSize = canvas.width / gridWidth;

      // Háttér csillagok mozgás hatása
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 20; i++) {
        let sx = (i * 37 + steps * 5) % canvas.width;
        let sy = (i * 53 + steps * 10) % canvas.height;
        ctx.fillRect(sx, sy, 1.5, 1.5);
      }

      // Galaktikus Kapu (Cél a szélvédő tetején)
      ctx.fillStyle = '#ff00ff';
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#ff00ff';
      ctx.fillRect(goal.x * tileSize + 2, goal.y * tileSize + 2, tileSize - 4, tileSize - 4);

      // Aszteroidák / Akadályok
      ctx.fillStyle = '#0088ff';
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#0088ff';
      obstacles.forEach(obs => {
        ctx.beginPath();
        ctx.arc((obs.x + 0.5) * tileSize, (obs.y + 0.5) * tileSize, tileSize / 2.5, 0, Math.PI * 2);
        ctx.fill();
      });

      // Saját Űrsikló a szélvédő alján
      ctx.fillStyle = '#00ffff';
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#00ffff';
      ctx.beginPath();
      let cx = (ship.x + 0.5) * tileSize;
      let cy = (ship.y + 0.5) * tileSize;
      ctx.moveTo(cx, cy - tileSize / 2);
      ctx.lineTo(cx - tileSize / 2, cy + tileSize / 2);
      ctx.lineTo(cx + tileSize / 2, cy + tileSize / 2);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function moveShip(dx, dy) {
      let nx = ship.x + dx;
      let ny = ship.y + dy;

      if (nx >= 0 && nx < gridWidth && ny >= 0 && ny < gridHeight) {
        // Ellenőrizzük, hogy ütközik-e akadállyal
        let hit = obstacles.some(o => o.x === nx && o.y === ny);
        if (hit) {
          score = Math.max(0, score - 5);
          alert("Figyelem! Aszteroida érintés! Óvatosabban a kormánnyal!");
          ship.x = 4; ship.y = 7; // Vissza indulóba
        } else {
          ship.x = nx;
          ship.y = ny;
          steps++;

          // Elérte a kaput?
          if (ship.x === goal.x && ship.y === goal.y) {
            score += 35;
            level++;
            checkPlushieReward();
            alert("Sikeres galaktikus ugrás! Következő szektor!");
            ship.x = 4; ship.y = 7;
            initSector();
          }
        }
        updateHUD();
        drawFlight();
      }
    }

    function checkPlushieReward() {
      let expectedPlushies = Math.floor(score / 100);
      while (plushies.length < expectedPlushies && plushies.length < plushieIcons.length) {
        plushies.push(plushieIcons[plushies.length]);
      }
    }

    function resetGameData() {
      if (confirm("Biztosan nullázod a repülési naplót?")) {
        localStorage.clear();
        score = 0; steps = 0; level = 1; plushies = [];
        ship = { x: 4, y: 7 };
        initSector();
        updateHUD();
        drawFlight();
      }
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp') moveShip(0, -1);
      if (e.key === 'ArrowDown') moveShip(0, 1);
      if (e.key === 'ArrowLeft') moveShip(-1, 0);
      if (e.key === 'ArrowRight') moveShip(1, 0);
    });

    initSector();
    updateHUD();
    drawFlight();
  </script>
</body>
</html>
